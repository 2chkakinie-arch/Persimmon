<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- ============================================================
       Vandal ブランドマーク（柿 + 再生三角形）
       ★ ロゴ差し替え方法: このファイルを上書き保存するだけで
         ヘッダー・ファビコン・設定ページのロゴがすべて変わります。
       Made by Kakinie with llytpr-wl.v01nh TEAM. V1
       ============================================================ -->
  <defs>
    <linearGradient id="pm-fruit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc36b"/>
      <stop offset=".45" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#e3143f"/>
    </linearGradient>
    <linearGradient id="pm-calyx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ddb6f"/>
      <stop offset="1" stop-color="#2f9e44"/>
    </linearGradient>
  </defs>
  <!-- 果実（柿）本体 -->
  <circle cx="128" cy="140" r="104" fill="url(#pm-fruit)"/>
  <!-- 光沢 -->
  <ellipse cx="92" cy="100" rx="40" ry="26" fill="#fff" opacity=".14" transform="rotate(-24 92 100)"/>
  <!-- ヘタ（柿のへた: 4弁のガク） -->
  <g fill="url(#pm-calyx)">
    <path d="M128 18c8 10 10 22 8 34-5-2-11-2-16 0-2-12 0-24 8-34z"/>
    <path d="M128 18c-12 4-20 13-24 24 5 1 10 4 14 8 4-9 8-20 10-32z" opacity=".92"/>
    <path d="M128 18c12 4 20 13 24 24-5 1-10 4-14 8-4-9-8-20-10-32z" opacity=".92"/>
  </g>
  <!-- 再生三角形（白） -->
  <path d="M104 92l72 48-72 48z" fill="#fff">
    <animate attributeName="opacity" values="1;.85;1" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
