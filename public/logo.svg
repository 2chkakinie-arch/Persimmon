<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" height="64">
  <!-- ============================================================
       Vandal ロゴ（ロックアップ: マーク + ワードマーク）
       ★ 差し替え方法: このファイルを上書きするだけでヘッダーの
         ロゴが変わります（logo-mark.svg はファビコン・小サイズ用）。
       Made by Kakinie with llytpr-wl.v01nh TEAM. V1
       ============================================================ -->
  <defs>
    <linearGradient id="lg-fruit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc36b"/>
      <stop offset=".45" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#e3143f"/>
    </linearGradient>
    <linearGradient id="lg-calyx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ddb6f"/>
      <stop offset="1" stop-color="#2f9e44"/>
    </linearGradient>
    <linearGradient id="lg-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#e3143f"/>
    </linearGradient>
  </defs>
  <!-- マーク（柿 + 再生） -->
  <g transform="translate(4 8) scale(.75)">
    <circle cx="32" cy="36" r="27" fill="url(#lg-fruit)"/>
    <ellipse cx="23" cy="25" rx="10" ry="6.5" fill="#fff" opacity=".16" transform="rotate(-24 23 25)"/>
    <g fill="url(#lg-calyx)">
      <path d="M32 3c2.1 2.6 2.6 5.8 2.1 8.9-1.3-.5-2.9-.5-4.2 0-.5-3.1 0-6.3 2.1-8.9z"/>
      <path d="M32 3c-3.1 1-5.2 3.4-6.3 6.3 1.3.3 2.6 1 3.6 2.1 1.1-2.4 2.1-5.2 2.7-8.4z" opacity=".92"/>
      <path d="M32 3c3.1 1 5.2 3.4 6.3 6.3-1.3.3-2.6 1-3.6 2.1-1.1-2.4-2.1-5.2-2.7-8.4z" opacity=".92"/>
    </g>
    <path d="M25.6 23.5l18.8 12.5-18.8 12.5z" fill="#fff"/>
  </g>
  <!-- ワードマーク -->
  <text x="76" y="46" font-family="'Roboto Condensed','Arial Narrow','Hiragino Kaku Gothic ProN',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="url(#lg-word)">Vandal</text>
  <text x="256" y="24" font-family="Roboto,Arial,sans-serif" font-size="12" font-weight="700" fill="#8a8f98">β</text>
</svg>
