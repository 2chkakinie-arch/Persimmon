<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persimmon</title>
<link rel="icon" href="/img/kaki.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a;--bg2:#111;--card:#161616;--border:#252525;
    --text:#f5f5f5;--sub:#909090;--accent:#ff7a2f;--accent2:#ff5722;
    --shadow:0 20px 60px rgba(255,122,47,.15);
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:hidden}
  body{
    background:
      radial-gradient(1200px 600px at 50% -100px,rgba(255,122,47,.12),transparent 60%),
      radial-gradient(800px 500px at 90% 100%,rgba(255,87,34,.08),transparent 60%),
      var(--bg);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  .container{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:32px;animation:fadeIn .8s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .logo{display:flex;flex-direction:column;align-items:center;gap:16px}
  .logo img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(255,122,47,.35));animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .logo h1{font-size:56px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .search{width:100%;position:relative}
  .search input{
    width:100%;padding:22px 64px 22px 28px;background:var(--card);
    border:1px solid var(--border);border-radius:100px;color:var(--text);
    font-size:17px;outline:none;transition:all .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .search input:focus{border-color:var(--accent);box-shadow:var(--shadow)}
  .search button{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:transform .2s;
  }
  .search button:hover{transform:translateY(-50%) scale(1.08)}
  .search button svg{width:22px;height:22px}
  .toggle{
    background:var(--card);border:1px solid var(--border);border-radius:100px;
    padding:6px;display:flex;position:relative;
  }
  .toggle button{
    background:transparent;border:none;color:var(--sub);
    padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;
    border-radius:100px;position:relative;z-index:2;transition:color .3s;letter-spacing:.5px;
  }
  .toggle button.active{color:#fff}
  .toggle .slider{
    position:absolute;top:6px;left:6px;height:calc(100% - 12px);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:100px;transition:all .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 4px 16px rgba(255,122,47,.4);
  }
  .footer{position:fixed;bottom:20px;color:var(--sub);font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/img/kaki.png" alt="Persimmon" onerror="this.style.display='none'">
      <h1>Persimmon</h1>
    </div>
    <form class="search" id="searchForm">
      <input id="q" type="text" placeholder="検索..." autocomplete="off" autofocus>
      <button type="submit" aria-label="検索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </form>
    <div class="toggle" id="toggle">
      <div class="slider" id="slider"></div>
      <button data-mode="yt" class="active">柿Tube</button>
      <button data-mode="proxy">Proxy</button>
    </div>
  </div>
  <div class="footer">Persimmon © 2026</div>

<script>
  const toggle=document.getElementById('toggle');
  const slider=document.getElementById('slider');
  const btns=toggle.querySelectorAll('button');
  let mode=localStorage.getItem('persimmon_mode')||'yt';

  function setMode(m){
    mode=m;localStorage.setItem('persimmon_mode',m);
    btns.forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
    const active=toggle.querySelector('button.active');
    slider.style.width=active.offsetWidth+'px';
    slider.style.left=active.offsetLeft+'px';
    document.getElementById('q').placeholder=m==='yt'?'柿Tubeで検索...':'URLまたは検索ワード...';
  }
  requestAnimationFrame(()=>setMode(mode));
  window.addEventListener('resize',()=>setMode(mode));
  btns.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

  document.getElementById('searchForm').addEventListener('submit',e=>{
    e.preventDefault();
    const q=document.getElementById('q').value.trim();
    if(!q)return;
    if(mode==='yt'){
      location.href='/search?q='+encodeURIComponent(q);
    }else{
      const isUrl=/^(https?:\/\/|[\w-]+\.[\w.-]+)/i.test(q);
      if(isUrl){
        const url=q.startsWith('http')?q:'https://'+q;
        location.href='/embed.html#'+url;
      }else{
        location.href='https://www.startpage.com/sp/search?query='+encodeURIComponent(q);
      }
    }
  });
</script>
</body>
</html>
